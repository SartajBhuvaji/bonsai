# Default configuration for the Qwen3-30B-A3B-Base pruning/distillation
# experiment. Loaded via bonsai.config.load_config.

name = "qwen3-30b-a3b"

[model]
repo_id = "Qwen/Qwen3-30B-A3B-Base"
# Tracks the Hub repo's main branch rather than a pinned commit SHA -- the
# base model itself never changed during this project, so this was never a
# real reproducibility risk in practice.
revision = "main"

[data]
dataset_id = "bigcode/the-stack-dedup"
data_dir = "data/typescript"
# This file's documented default. Several individual phases drew their own
# smaller, ad hoc calibration sample instead (e.g. 32-48 sequences for a
# specific importance-scoring or pruning-sweep run) -- see the paper
# (docs/latex/main.pdf) for the exact count a given result actually used.
calibration_samples = 1024
# Reserves the first of 71 shards (confirmed via bonsai.data.list_shards) for
# calibration, the rest for retraining -- shard-level, not row-level, so the
# two pools are disjoint by construction. Pinned here rather than
# recomputed live so the split can't silently shift if the Hub repo's shard
# count ever changes.
calibration_shards = [
    "data/typescript/data-00000-of-00071.parquet",
]
retraining_shards = [
    "data/typescript/data-00001-of-00071.parquet",
