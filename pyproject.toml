[project]
name = "bonsai"
version = "0.4.0"
description = "Pruning and distilling a Mixture-of-Experts model into a smaller, TypeScript-specialized one"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sartaj Bhuvaji", email = "sbhuvaji@seattleu.edu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "transformers>=5.15",
    "huggingface-hub>=0.26",
    "torch>=2.4",
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "tox>=4.61.4",
]
# For running and rendering the notebooks under notebooks/ -- see
# notebooks/README.md for what belongs in a notebook vs. in src/bonsai/.
notebook = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["bonsai"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ANN",  # annotations
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# datasets ships no py.typed marker / stubs as of the version this project pins.
module = "datasets.*"
ignore_missing_imports = true
