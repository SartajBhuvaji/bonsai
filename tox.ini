# Test and lint runner. CI calls these same environments, so `tox` locally and
# CI cannot drift apart.
#
#   tox              every supported interpreter, plus lint, type, notebooks
#   tox -e py        the interpreter tox itself is running under
#   tox -e lint      ruff check + format check (covers notebook cells too)
#   tox -e fmt       reformat and autofix in place (not run by CI)
#   tox -e notebooks check the committed notebooks still carry their outputs

[tox]
env_list = py311, py312, py313, lint, type, notebooks
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the test suite
extras = dev
commands = pytest {posargs}

[testenv:lint]
description = ruff lint and format check
skip_install = true
deps = ruff>=0.6
commands =
    ruff check .
    ruff format --check .

[testenv:fmt]
description = reformat and autofix in place
skip_install = true
deps = ruff>=0.6
commands =
    ruff format .
    ruff check --fix .

[testenv:type]
description = mypy
extras = dev
commands = mypy

[testenv:notebooks]
description = check the committed notebooks still carry their outputs
skip_install = true
commands = python tools/check_notebooks.py

[testenv:cov]
description = tests with a coverage report
extras = dev
commands = pytest --cov=bonsai --cov-report=term-missing {posargs}
