# Test and lint runner. CI calls these same environments, so `tox` locally and
# CI cannot drift apart.
#
#   tox              every supported interpreter, plus lint, type, notebooks
#   tox -e py        the interpreter tox itself is running under
#   tox -e lint      ruff check + format check (covers notebook cells too)
#   tox -e fmt       reformat and autofix in place (not run by CI)
#   tox -e notebooks check the committed notebooks still carry their outputs

[tox]
env_list = py311, py312, py313, lint, type, notebooks
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the test suite
# notebook, not just dev: tests/test_viz.py imports bonsai.viz, which needs
# matplotlib.
extras = dev, notebook
commands = pytest {posargs}

[testenv:lint]
description = ruff lint and format check
skip_install = true
deps = ruff>=0.6
commands =
    ruff check .
    ruff format --check .

[testenv:fmt]
description = reformat and autofix in place
skip_install = true
deps = ruff>=0.6
commands =
    ruff format .
    ruff check --fix .

[testenv:type]
description = mypy
# notebook, not just dev: bonsai.viz needs matplotlib to be importable for
# mypy to check it.
extras = dev, notebook
# numpy 2.4.6 started shipping unguarded PEP 695 `type` statements in its
# .pyi stubs (still there as of 2.5.3, the latest at the time of writing);
# mypy treats that as an unfilterable syntax error whenever [tool.mypy]'s
# python_version is below 3.12 (ours is 3.11, to keep catching 3.11-only
# incompatibilities in our own code -- no per-module override works around
# this, it fails before any override would apply). Bisected empirically:
# 2.4.5 is clean, 2.4.6 is not. bonsai never imports numpy directly -- it
# arrives transitively through torch -- so ceiling it here, in the
# type-checking env only, costs nothing for real installs. Safe to drop once
# numpy guards the stub (or once this project moves its floor to Python 3.12).
deps = numpy<2.4.6
commands = mypy

[testenv:notebooks]
description = check the committed notebooks still carry their outputs
skip_install = true
commands = python tools/check_notebooks.py

[testenv:cov]
description = tests with a coverage report
extras = dev, notebook
commands = pytest --cov=bonsai --cov-report=term-missing {posargs}
